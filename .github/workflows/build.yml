name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/RomSwitcher.csproj -c Release -o dist

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/RetroBatRomSwitcher.exe, dist/README.md -DestinationPath RetroBatRomSwitcher.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RetroBatRomSwitcher
          path: RetroBatRomSwitcher.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RetroBatRomSwitcher.zip
          generate_release_notes: true
