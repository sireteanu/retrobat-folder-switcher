name: build

# Every push to main builds the exe. If the <Version> in src/FolderSwitcher.csproj
# has no release yet, a release "v<Version>" (and its tag) is created automatically.
# To ship a new version: bump <Version> and push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content src/FolderSwitcher.csproj
          $v = ($p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build src/FolderSwitcher.csproj -c Release -o dist

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/RetroBatFolderSwitcher.exe, dist/README.md -DestinationPath RetroBatFolderSwitcher.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RetroBatFolderSwitcher
          path: RetroBatFolderSwitcher.zip

      - name: Check for existing release
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" *> $null
          "exists=$($LASTEXITCODE -eq 0)" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Release
        if: steps.rel.outputs.exists == 'False'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: RetroBatFolderSwitcher.zip
          generate_release_notes: true
